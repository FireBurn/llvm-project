header: setjmp.h
standards:
  - stdc
macros:
  - macro_name: _setjmp
    macro_header: setjmp-macros.h
  - macro_name: _longjmp
    macro_header: setjmp-macros.h
types:
  - type_name: jmp_buf
functions:
  - name: longjmp
    standards:
      - stdc
    return_type: _Noreturn void
    arguments:
      - type: jmp_buf
      - type: int
  - name: setjmp
    standards:
      - stdc
    return_type: int
    attributes:
      - _Returns_twice
    arguments:
      - type: jmp_buf
  - name: sigsetjmp
    standards:
      - posix
    return_type: int
    attributes:
      - _Returns_twice
    arguments:
      - type: sigjmp_buf
      - type: int
  - name: siglongjmp
    standards:
      - posix
    return_type: _Noreturn void
    arguments:
      - type: sigjmp_buf
      - type: int
