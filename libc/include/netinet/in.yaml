  - type_name: struct_ipv6_mreq
  - type_name: struct_ip_mreq
  - type_name: struct_ip_mreq_source
  - type_name: struct_ip_mreqn
  - type_name: struct_ip_msfilter
  - type_name: struct_ip_opts
  # Type also defined by sys/socket.h, but listing it explicitly as it is
  # required by POSIX.
  - type_name: sa_family_t
# The ports the well known services were given, and the two boundaries
# that say who may bind what: below IPPORT_RESERVED is for privileged
# processes, and above IPPORT_USERRESERVED is left to servers nobody
# privileged runs.
enums:
  - name: IPPORT_ECHO
    value: 7
  - name: IPPORT_DISCARD
    value: 9
  - name: IPPORT_SYSTAT
    value: 11
  - name: IPPORT_DAYTIME
    value: 13
  - name: IPPORT_NETSTAT
    value: 15
  - name: IPPORT_FTP
    value: 21
  - name: IPPORT_TELNET
    value: 23
