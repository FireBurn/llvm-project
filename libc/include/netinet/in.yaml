header: netinet/in.h
standards:
  - posix
merge_yaml_files:
  - ../htons-family.yaml
public_includes:
  - endian.h
  # This is permitted (but not required) by POSIX and many applications depend
  # on it. If we have a "pedantic" mode in the future, we might want to exclude
  # it there.
  - sys/socket.h
macros:
  - macro_name: IPPROTO_IP
    macro_header: netinet-in-macros.h
  - macro_name: IPPROTO_ICMP
    macro_header: netinet-in-macros.h
  - macro_name: IPPROTO_TCP
    macro_header: netinet-in-macros.h
  - macro_name: IPPROTO_UDP
    macro_header: netinet-in-macros.h
  - macro_name: IPPROTO_IPV6
    macro_header: netinet-in-macros.h
  - macro_name: IPPROTO_RAW
    macro_header: netinet-in-macros.h
  - macro_name: IPPROTO_MAX
    macro_header: netinet-in-macros.h
  - macro_name: IN6ADDR_ANY_INIT
    macro_header: netinet-in-macros.h
  - macro_name: IN6ADDR_LOOPBACK_INIT
    macro_header: netinet-in-macros.h
  - macro_name: INET_ADDRSTRLEN
    macro_header: inet-address-macros.h
  - macro_name: INET6_ADDRSTRLEN
    macro_header: inet-address-macros.h

  - macro_name: SOL_IP
    macro_value: 0

  # IP level socket options
  - macro_name: MCAST_JOIN_GROUP
    macro_value: 42 # struct group_req
  - macro_name: MCAST_BLOCK_SOURCE
    macro_value: 43 # struct group_source_req
  - macro_name: MCAST_UNBLOCK_SOURCE
    macro_value: 44 # struct group_source_req
  - macro_name: MCAST_LEAVE_GROUP
    macro_value: 45 # struct group_req
  - macro_name: MCAST_JOIN_SOURCE_GROUP
    macro_value: 46 # struct group_source_req
  - macro_name: MCAST_LEAVE_SOURCE_GROUP
    macro_value: 47 # struct group_source_req
  - macro_name: MCAST_MSFILTER
    macro_value: 48 # struct group_filter
  # Whether the sources a filter lists are the ones to accept or the ones to
  # refuse.
  - macro_name: MCAST_EXCLUDE
    macro_value: 0
  - macro_name: MCAST_INCLUDE
    macro_value: 1

  # IPv6 level socket options
  - macro_name: IPV6_AUTHHDR
    macro_value: 10 # int
types:
  - type_name: struct_in_pktinfo
  - type_name: struct_in6_pktinfo
  - type_name: struct_ip6_mtuinfo
  - type_name: in_port_t
  - type_name: in_addr_t
  - type_name: struct_sockaddr_in
  - type_name: struct_sockaddr_in6
  - type_name: struct_group_req
  - type_name: struct_group_source_req
  - type_name: struct_in_addr
  - type_name: struct_in6_addr
  - type_name: struct_ipv6_mreq
  - type_name: struct_ip_mreq
  - type_name: struct_ip_mreq_source
  - type_name: struct_ip_mreqn
  - type_name: struct_ip_msfilter
  - type_name: struct_ip_opts
  # Type also defined by sys/socket.h, but listing it explicitly as it is
  # required by POSIX.
  - type_name: sa_family_t
# The ports the well known services were given, and the two boundaries
# that say who may bind what: below IPPORT_RESERVED is for privileged
# processes, and above IPPORT_USERRESERVED is left to servers nobody
# privileged runs.
enums:
  - name: IPPORT_ECHO
    value: 7
  - name: IPPORT_DISCARD
    value: 9
  - name: IPPORT_SYSTAT
    value: 11
  - name: IPPORT_DAYTIME
    value: 13
  - name: IPPORT_NETSTAT
    value: 15
  - name: IPPORT_FTP
    value: 21
  - name: IPPORT_TELNET
    value: 23
  - name: IPPORT_SMTP
    value: 25
  - name: IPPORT_TIMESERVER
    value: 37
  - name: IPPORT_NAMESERVER
    value: 42
  - name: IPPORT_WHOIS
    value: 43
  - name: IPPORT_MTP
    value: 57
  - name: IPPORT_TFTP
    value: 69
  - name: IPPORT_RJE
    value: 77
  - name: IPPORT_FINGER
    value: 79
  - name: IPPORT_TTYLINK
    value: 87
  - name: IPPORT_SUPDUP
    value: 95
  - name: IPPORT_EXECSERVER
    value: 512
  - name: IPPORT_LOGINSERVER
    value: 513
  - name: IPPORT_CMDSERVER
    value: 514
  - name: IPPORT_EFSSERVER
    value: 520
  - name: IPPORT_BIFFUDP
    value: 512
  - name: IPPORT_WHOSERVER
    value: 513
  - name: IPPORT_ROUTESERVER
    value: 520
  - name: IPPORT_RESERVED
    value: 1024
  - name: IPPORT_USERRESERVED
    value: 5000
objects:
  - object_name: in6addr_any
    object_type: const struct in6_addr
  - object_name: in6addr_loopback
    object_type: const struct in6_addr
functions: []
