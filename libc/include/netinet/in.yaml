    value: 37
  - name: IPPORT_NAMESERVER
    value: 42
  - name: IPPORT_WHOIS
    value: 43
  - name: IPPORT_MTP
    value: 57
  - name: IPPORT_TFTP
    value: 69
  - name: IPPORT_RJE
    value: 77
  - name: IPPORT_FINGER
    value: 79
  - name: IPPORT_TTYLINK
    value: 87
  - name: IPPORT_SUPDUP
    value: 95
  - name: IPPORT_EXECSERVER
    value: 512
  - name: IPPORT_LOGINSERVER
    value: 513
  - name: IPPORT_CMDSERVER
    value: 514
