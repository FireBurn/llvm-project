# This file has declarations that appear both in <sys/select.h> and in
# <sys/time.h>.

macros:
  - macro_name: FD_SETSIZE
    macro_header: sys-select-macros.h
types:
  - type_name: fd_set
  - type_name: struct_timeval
  - type_name: suseconds_t
  - type_name: time_t
functions:
  - name: select
    standards:
      - posix
    return_type: int
    arguments:
      - type: int
      - type: fd_set *__restrict
      - type: fd_set *__restrict
      - type: fd_set *__restrict
      - type: struct timeval *__restrict
