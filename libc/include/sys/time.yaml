header: sys/time.h
public_includes:
  # POSIX has this header define fd_set and the macros that go with it, and
  # declare select, which is where a program that calls it often gets them.
  - sys/select.h
standards:
  - posix
macros:
  - macro_name: ITIMER_REAL
    macro_header: sys-time-macros.h
  - macro_name: ITIMER_VIRTUAL
    macro_header: sys-time-macros.h
  - macro_name: ITIMER_PROF
    macro_header: sys-time-macros.h
  - macro_name: timeradd
    macro_header: sys-time-macros.h
types:
  - type_name: struct_timezone
  - type_name: struct_timespec
  - type_name: struct_timeval
  - type_name: struct_itimerval
enums: []
objects: []
functions:
  - name: utimes
    return_type: int
    arguments:
      - type: const char*
      - type: const struct timeval*
  - name: lutimes
    return_type: int
    arguments:
      - type: const char*
      - type: const struct timeval*
  - name: setitimer
    return_type: int
    arguments:
      - type: int
      - type: const struct itimerval *__restrict
      - type: struct itimerval *__restrict
  - name: getitimer
    return_type: int
    arguments:
      - type: int
      - type: struct itimerval *
  - name: settimeofday
    standards:
      - bsd
    return_type: int
    arguments:
      - type: const struct timeval *
      - type: const struct timezone *
  - name: gettimeofday
    return_type: int
    arguments:
      - type: struct timeval *
      - type: void *
