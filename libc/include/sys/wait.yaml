header: sys/wait.h
public_includes:
  # glibc's <sys/wait.h> pulls in all of <signal.h>: waiting on a child
  # reports how a signal ended it, and callers name and send those signals
  # without including anything further.
  - signal.h
standards:
  - posix
macros:
  - macro_name: WCOREDUMP
    macro_header: sys-wait-macros.h
types:
  - type_name: id_t
  - type_name: idtype_t
  - type_name: siginfo_t
  - type_name: struct_rusage
  - type_name: pid_t
enums: []
objects: []
functions:
  - name: wait
    standards:
      - posix
    return_type: pid_t
    arguments:
      - type: int *
  - name: wait4
    standards:
      - bsd
      - posix
    return_type: pid_t
    arguments:
      - type: pid_t
      - type: int *
      - type: int
      - type: struct rusage *
  - name: waitid
    standards:
      - posix
    return_type: int
    arguments:
      - type: idtype_t
      - type: id_t
      - type: siginfo_t *
      - type: int
  - name: waitpid
    standards:
      - posix
    return_type: pid_t
    arguments:
      - type: pid_t
      - type: int *
      - type: int
