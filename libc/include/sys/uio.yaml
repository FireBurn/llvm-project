      - type: const struct iovec *
      - type: unsigned long
      - type: const struct iovec *
      - type: unsigned long
      - type: unsigned long
  - name: process_vm_writev
    standards:
      - linux
    return_type: ssize_t
    arguments:
      - type: pid_t
      - type: const struct iovec *
      - type: unsigned long
      - type: const struct iovec *
      - type: unsigned long
      - type: unsigned long
  - name: readv
    standards:
      - posix
    return_type: ssize_t
    arguments:
      - type: int
      - type: const struct iovec *
      - type: int
